plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.financetracker.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.financetracker.app'
        minSdk 26
        targetSdk 34
        // versionCode scheme matches MTG Companion: major*10000 + minor*100 + patch.
        // Bump BOTH per release - the updater compares versionName, Android compares versionCode.
        versionCode 10200
        versionName '1.2.0'

        // The bundled OCR model ships native libraries for every ABI, which roughly triples the
        // APK. A personal build only ever runs on one architecture plus the emulator, so the
        // other two are dead weight.
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    // This is a personal build with no release signing key, so `assembleRelease` produces an
    // *unsigned* APK that Android will refuse to install. Use `assembleDebug` - debug builds are
    // signed with the local debug key, which is stable, so they update each other normally.
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4'
    implementation 'androidx.activity:activity-compose:1.9.1'

    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // Device-credential fallback comes free with BiometricPrompt, so the app never has to
    // store a PIN of its own - the lock is enforced by the OS keyguard.
    implementation 'androidx.biometric:biometric:1.1.0'
    // biometric:1.1.0 pulls in fragment 1.2.5, whose FragmentActivity still enforces the legacy
    // "lower 16 bits only" request-code check. The Activity Result API generates codes across the
    // full int range, so every file picker launched from this activity crashes without this bump.
    implementation 'androidx.fragment:fragment-ktx:1.8.2'

    // The *bundled* recogniser, not the Play-Services one: the model ships inside the APK
    // and runs entirely on device, so reading a receipt needs no network and the app keeps
    // having no INTERNET permission. It costs APK size, which is the right trade here.
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    // Only used by the OTA updater - the app makes no other network calls.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
